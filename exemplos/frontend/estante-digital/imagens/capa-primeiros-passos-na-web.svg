<svg xmlns="http://www.w3.org/2000/svg" width="240" height="320" viewBox="0 0 240 320">
  <!-- Capa do livro fictício "Primeiros passos na Web", desenhada para este exemplo. -->
  <rect width="240" height="320" fill="#1f4e8c"/>
  <text x="120" y="62" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">Primeiros</text>
  <text x="120" y="92" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">passos</text>
  <text x="120" y="122" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">na Web</text>
  <circle cx="120" cy="215" r="58" fill="none" stroke="#ffffff" stroke-width="4"/>
  <ellipse cx="120" cy="215" rx="26" ry="58" fill="none" stroke="#ffffff" stroke-width="3"/>
  <line x1="62" y1="215" x2="178" y2="215" stroke="#ffffff" stroke-width="3"/>
  <line x1="72" y1="185" x2="168" y2="185" stroke="#ffffff" stroke-width="2"/>
  <line x1="72" y1="245" x2="168" y2="245" stroke="#ffffff" stroke-width="2"/>
</svg>
